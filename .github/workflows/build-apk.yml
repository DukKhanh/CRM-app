name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "crm-frontend/**" 
      - ".github/workflows/frontend-build-apk.yml"

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK via Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 30

   
    defaults:
      run:
        working-directory: crm-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-frontend/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} 

      - name: Install dependencies
        run: npm ci

      - name: Build APK on Expo Cloud
        run: eas build --platform android --profile preview --non-interactive