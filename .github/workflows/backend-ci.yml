name: Backend CI

on:
  pull_request:
    paths:
      - "crm-backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "crm-backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: crm-backend

    env:
      NODE_ENV: test
      PORT: 3000

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public
      # THÊM DÒNG NÀY ĐỂ FIX LỖI P1012 PRISMA:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/crm_test?schema=public

      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long

      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      TRUST_PROXY: "0"
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type-check source code
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production application
        run: npm run build